[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-task-board"
version = "0.1.0"
description = "Local SQLite task queue and kanban for cooperating AI agents"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["croniter>=6,<7", "mcp>=1.20,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.11"]

[project.scripts]
atb = "agent_task_board.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_task_board"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
